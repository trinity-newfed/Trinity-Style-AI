services:
  trinity_ollama:
    image: ollama/ollama:latest
    container_name: trinity_ollama_container
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0

  ai_backend:
    build: 
      context: .        
      dockerfile: Dockerfile.cpu
    container_name: trinity_ai_container
    tty: true
    stdin_open: true
    privileged: true
    depends_on:
      - trinity_db
      - trinity_ollama
    environment:
      - OLLAMA_BASE_URL=http://trinity_ollama:11434
      - FLASK_RUN_HOST=0.0.0.0
    volumes:
      - .:/workspace    
    working_dir: /workspace
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"